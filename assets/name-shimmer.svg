
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="180"
     viewBox="0 0 1200 180">

  <defs>
    <!-- Gradient màu chữ -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1"
               values="-100%;100%;-100%"
               dur="6s"
               repeatCount="indefinite"/>
      <animate attributeName="x2"
               values="0%;200%;0%"
               dur="6s"
               repeatCount="indefinite"/>
    </linearGradient>

    <!-- Hiệu ứng phát sáng -->
    <filter id="neonGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vùng hiển thị -->
    <clipPath id="viewport">
      <rect x="0" y="0" width="1200" height="180"/>
    </clipPath>
  </defs>

  <g clip-path="url(#viewport)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="-700 0"
        to="1200 0"
        dur="9s"
        repeatCount="indefinite"
        calcMode="linear"/>

      <!-- Lớp phát sáng -->
      <text x="0" y="116"
            font-family="Arial, Helvetica, sans-serif"
            font-size="76"
            font-weight="900"
            letter-spacing="5"
            textLength="660"
            lengthAdjust="spacingAndGlyphs"
            fill="url(#textGradient)"
            filter="url(#neonGlow)"
            opacity="0.75">HANH NGUYEN</text>

      <!-- Lớp chữ chính -->
      <text x="0" y="116"
            font-family="Arial, Helvetica, sans-serif"
            font-size="76"
            font-weight="900"
            letter-spacing="5"
            textLength="660"
            lengthAdjust="spacingAndGlyphs"
            fill="url(#textGradient)">HANH NGUYEN</text>

      <!-- Ánh sáng lướt trên chữ -->
      <text x="0" y="116"
            font-family="Arial, Helvetica, sans-serif"
            font-size="76"
            font-weight="900"
            letter-spacing="5"
            textLength="660"
            lengthAdjust="spacingAndGlyphs"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.5"
            opacity="0.65">
        <animate attributeName="stroke-dasharray"
                 values="0 2000;660 2000"
                 dur="3s"
                 repeatCount="indefinite"/>
        HANH NGUYEN
      </text>
    </g>
  </g>
</svg>
