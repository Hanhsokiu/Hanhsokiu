<svg xmlns="http://www.w3.org/2000/svg"
width="1000" height="180"
viewBox="0 0 1000 180">

<defs>
<linearGradient id="neon">
 <stop offset="0%" stop-color="#38BDF8"/>
 <stop offset="35%" stop-color="#818CF8"/>
 <stop offset="60%" stop-color="#FFFFFF"/>
 <stop offset="85%" stop-color="#C084FC"/>
 <stop offset="100%" stop-color="#38BDF8"/>
</linearGradient>

<filter id="glow" x="-30%" y="-100%"
       width="160%" height="300%">
 <feGaussianBlur stdDeviation="6"/>
</filter>

<linearGradient id="shine"
 gradientUnits="userSpaceOnUse"
 x1="-200" y1="0" x2="100" y2="0">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
 <stop offset="50%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>

 <animate attributeName="x1"
   from="-300" to="1300" dur="3s"
   repeatCount="indefinite"/>
 <animate attributeName="x2"
   from="0" to="1600" dur="3s"
   repeatCount="indefinite"/>
</linearGradient>

<mask id="textMask">
 <rect width="100%" height="100%" fill="black"/>
 <text x="0" y="105"
   font-family="Arial"
   font-size="76"
   font-weight="900"
   letter-spacing="4"
   fill="white">HANH NGUYEN</text>
</mask>

<clipPath id="screen">
 <rect width="1000" height="180"/>
</clipPath>
</defs>

<g clip-path="url(#screen)">

<!-- Moving text -->
<g>
 <animateTransform
   attributeName="transform"
   type="translate"
   from="-500 0"
   to="1000 0"
   dur="7s"
   repeatCount="indefinite"/>

 <!-- Neon glow -->
 <text x="0" y="105"
   font-family="Arial"
   font-size="76"
   font-weight="900"
   letter-spacing="4"
   fill="#60A5FA"
   filter="url(#glow)">
   HANH NGUYEN
 </text>

 <!-- Main text -->
 <text x="0" y="105"
   font-family="Arial"
   font-size="76"
   font-weight="900"
   letter-spacing="4"
   fill="url(#neon)">
   HANH NGUYEN
 </text>

 <!-- Moving shine -->
 <rect x="0" y="0" width="500" height="180"
   fill="url(#shine)"
   mask="url(#textMask)"/>
</g>

<!-- Flying particles -->
<g fill="#FFFFFF">
 <circle cy="45" r="3">
   <animate attributeName="cx"
     from="0" to="1000" dur="4s"
     repeatCount="indefinite"/>
   <animate attributeName="opacity"
     values="0;1;0" dur="4s"
     repeatCount="indefinite"/>
 </circle>

 <circle cy="140" r="2">
   <animate attributeName="cx"
     from="1000" to="0" dur="5s"
     repeatCount="indefinite"/>
   <animate attributeName="opacity"
     values="0;1;0" dur="5s"
     repeatCount="indefinite"/>
 </circle>
</g>

</g>
</svg>
