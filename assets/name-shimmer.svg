
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="220"
     viewBox="0 0 1400 220">

  <defs>
    <!-- Gradient neon đổi màu -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color"
          values="#38bdf8;#818cf8;#22d3ee;#38bdf8"
          dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color"
          values="#c084fc;#f0abfc;#a78bfa;#c084fc"
          dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color"
          values="#22d3ee;#60a5fa;#f472b6;#22d3ee"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Hiệu ứng glow -->
    <filter id="glow"
            x="-12%" y="-40%"
            width="124%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Ánh sáng quét qua chữ -->
    <linearGradient id="shine"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="38%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.92"/>
      <stop offset="62%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Nội dung chữ -->
    <text id="messageText"
          x="0" y="132"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="50"
          font-weight="800"
          textLength="1300"
          lengthAdjust="spacingAndGlyphs">👋 Hey there! Welcome to my little corner of GitHub!</text>

    <!-- Giới hạn vùng ánh sáng trên chữ -->
    <clipPath id="letters"
              clipPathUnits="userSpaceOnUse">
      <use xlink:href="#messageText"/>
    </clipPath>

    <!-- Giới hạn khung hình -->
    <clipPath id="stage">
      <rect width="1400" height="220"/>
    </clipPath>

    <!-- Ngôi sao 4 cánh -->
    <path id="star"
          d="M0,-11 L2.5,-2.5 L11,0 L2.5,2.5
             L0,11 L-2.5,2.5 L-11,0 L-2.5,-2.5 Z"
          fill="white"/>

    <!-- Một cụm chữ hoàn chỉnh -->
    <g id="message">

      <!-- Glow nền -->
      <use xlink:href="#messageText"
           fill="#a78bfa"
           opacity="0.70"
           filter="url(#glow)"/>

      <!-- Chữ chính -->
      <use xlink:href="#messageText"
           fill="url(#neon)"/>

      <!-- Hiệu ứng shimmer quét phải sang trái -->
      <g clip-path="url(#letters)">
        <rect x="1400"
              y="53"
              width="360"
              height="115"
              fill="url(#shine)"
              transform="skewX(-14)">
          <animate
            attributeName="x"
            values="1400;-450"
            dur="5s"
            calcMode="linear"
            repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Sao lấp lánh thứ nhất -->
      <g transform="translate(120 60)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.3;1.1;0.3"
            dur="2.4s"
            repeatCount="indefinite"/>
          <animate
            attributeName="opacity"
            values="0.15;1;0.15"
            dur="2.4s"
            repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

      <!-- Sao lấp lánh thứ hai -->
      <g transform="translate(570 166)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.2;0.9;0.2"
            dur="3s"
            begin="0.7s"
            repeatCount="indefinite"/>
          <animate
            attributeName="opacity"
            values="0.1;0.95;0.1"
            dur="3s"
            begin="0.7s"
            repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

      <!-- Sao lấp lánh thứ ba -->
      <g transform="translate(1060 57)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.25;1;0.25"
            dur="2.7s"
            begin="1.2s"
            repeatCount="indefinite"/>
          <animate
            attributeName="opacity"
            values="0.1;1;0.1"
            dur="2.7s"
            begin="1.2s"
            repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

    </g>
  </defs>

  <!-- Hai bản sao tạo chuyển động liên tục -->
  <g clip-path="url(#stage)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1510 0"
        dur="14s"
        calcMode="linear"
        repeatCount="indefinite"/>

      <use xlink:href="#message" x="0"/>
      <use xlink:href="#message" x="1510"/>
    </g>
  </g>

</svg>
