<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="220"
     viewBox="0 0 1400 220">

  <defs>
    <!-- Gradient chữ -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color"
                 values="#60a5fa;#a78bfa;#f472b6;#38bdf8;#60a5fa"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color"
                 values="#c084fc;#f9a8d4;#93c5fd;#c084fc"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color"
                 values="#22d3ee;#60a5fa;#e879f9;#22d3ee"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>

      <animate attributeName="x1"
               values="-20%;120%;-20%"
               dur="10s"
               repeatCount="indefinite"/>
      <animate attributeName="x2"
               values="80%;220%;80%"
               dur="10s"
               repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow mềm -->
    <filter id="softGlow" x="-40%" y="-60%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer quét qua chữ -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="45%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clipText">
      <text x="0" y="132"
            font-family="Segoe UI, Arial, Helvetica, sans-serif"
            font-size="50"
            font-weight="800"
            letter-spacing="1.2">
        👋 Hey there! Welcome to my little corner of GitHub!
      </text>
    </clipPath>

    <clipPath id="viewport">
      <rect x="0" y="0" width="1400" height="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#viewport)">
    <!-- Cả cụm chữ chạy ngang -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="-1220 0; 1400 0"
        dur="14s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;1"
        keySplines="0.42 0 0.58 1"/>

      <!-- Glow nền -->
      <text x="0" y="132"
            font-family="Segoe UI, Arial, Helvetica, sans-serif"
            font-size="50"
            font-weight="800"
            letter-spacing="1.2"
            fill="url(#textGradient)"
            filter="url(#softGlow)"
            opacity="0.45">
        👋 Hey there! Welcome to my little corner of GitHub!
      </text>

      <!-- Chữ chính -->
      <text x="0" y="132"
            font-family="Segoe UI, Arial, Helvetica, sans-serif"
            font-size="50"
            font-weight="800"
            letter-spacing="1.2"
            fill="url(#textGradient)">
        👋 Hey there! Welcome to my little corner of GitHub!
      </text>

      <!-- Viền sáng nhẹ -->
      <text x="0" y="132"
            font-family="Segoe UI, Arial, Helvetica, sans-serif"
            font-size="50"
            font-weight="800"
            letter-spacing="1.2"
            fill="none"
            stroke="rgba(255,255,255,0.7)"
            stroke-width="0.8"
            opacity="0.7">
        👋 Hey there! Welcome to my little corner of GitHub!
      </text>

      <!-- Dải sáng quét -->
      <g clip-path="url(#clipText)">
        <rect x="-260" y="35" width="240" height="160"
              fill="url(#shimmerGradient)"
              transform="skewX(-20)">
          <animate attributeName="x"
                   values="-320;1150;-320"
                   dur="4.8s"
                   repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Sparkles -->
      <g opacity="0.95">
        <!-- sparkle 1 -->
        <g transform="translate(40 58)">
          <animateTransform attributeName="transform"
                            type="scale"
                            values="0.6;1.15;0.6"
                            dur="1.8s"
                            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.2;1;0.2"
                   dur="1.8s"
                   repeatCount="indefinite"/>
          <path d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z"
                fill="#ffffff"/>
        </g>

        <!-- sparkle 2 -->
        <g transform="translate(420 48)">
          <animateTransform attributeName="transform"
                            type="scale"
                            values="0.4;1;0.4"
                            dur="2.2s"
                            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.1;0.95;0.1"
                   dur="2.2s"
                   repeatCount="indefinite"/>
          <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z"
                fill="#ffffff"/>
        </g>

        <!-- sparkle 3 -->
        <g transform="translate(760 168)">
          <animateTransform attributeName="transform"
                            type="scale"
                            values="0.5;1.2;0.5"
                            dur="2s"
                            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.15;1;0.15"
                   dur="2s"
                   repeatCount="indefinite"/>
          <path d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z"
                fill="#ffffff"/>
        </g>

        <!-- sparkle 4 -->
        <g transform="translate(1110 60)">
          <animateTransform attributeName="transform"
                            type="scale"
                            values="0.45;1.1;0.45"
                            dur="2.4s"
                            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.2;1;0.2"
                   dur="2.4s"
                   repeatCount="indefinite"/>
          <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"
                fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>
</svg>
