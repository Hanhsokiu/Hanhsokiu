<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-label="HANH NGUYEN - chữ chạy neon lấp lánh">
  <defs>
    <!-- Màu chuyển mềm, có biến đổi sắc độ liên tục -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#59e1ff">
        <animate attributeName="stop-color" values="#59e1ff;#a78bfa;#59e1ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#b38aff">
        <animate attributeName="stop-color" values="#b38aff;#f3a6ff;#b38aff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#69b7ff">
        <animate attributeName="stop-color" values="#69b7ff;#5ce1e6;#69b7ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Gradient cho ánh sáng quét ngang qua mặt chữ -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trailGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="textGlow" x="-25%" y="-70%" width="150%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="starGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="viewport">
      <rect width="1200" height="180"/>
    </clipPath>
    <!-- Vệt sáng chỉ xuất hiện bên trong nét chữ -->
    <clipPath id="letterMask">
      <text x="0" y="115" font-family="Arial, Helvetica, sans-serif"
            font-size="76" font-weight="900" letter-spacing="5"
            textLength="660" lengthAdjust="spacingAndGlyphs">HANH NGUYEN</text>
    </clipPath>

    <!-- Ngôi sao 4 cánh, dùng lại ở nhiều vị trí -->
    <g id="sparkle" fill="#fff">
      <path d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12Z"/>
      <circle r="2.5" fill="#e0f7ff"/>
    </g>
  </defs>

  <g clip-path="url(#viewport)">
    <!-- Cả cụm di chuyển đều; bắt đầu/kết thúc nằm ngoài khung nên không bị giật -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        from="-760 0" to="1200 0"
                        dur="11s" calcMode="linear" repeatCount="indefinite"/>

      <!-- Đuôi ánh sáng mềm phía sau chữ -->
      <g stroke="url(#trailGradient)" stroke-linecap="round">
        <path d="M-150 77 H-14" stroke-width="2.5" opacity="0.6"/>
        <path d="M-105 91 H-18" stroke-width="1.4" opacity="0.5"/>
        <path d="M-180 106 H-22" stroke-width="1" opacity="0.32"/>
      </g>

      <!-- Lớp bóng mềm tạo quầng sáng, không làm chữ bị nhòe -->
      <text x="0" y="115" font-family="Arial, Helvetica, sans-serif"
            font-size="76" font-weight="900" letter-spacing="5"
            textLength="660" lengthAdjust="spacingAndGlyphs"
            fill="url(#textGradient)" filter="url(#textGlow)" opacity="0.85">
        <animate attributeName="opacity" values="0.65;0.95;0.65" dur="3.5s" repeatCount="indefinite"/>
        👋 Hey there! Welcome to my little corner of GitHub!
      </text>

      <!-- Lớp chữ nét rõ -->
      <text x="0" y="115" font-family="Arial, Helvetica, sans-serif"
            font-size="76" font-weight="900" letter-spacing="5"
            textLength="660" lengthAdjust="spacingAndGlyphs"
            fill="url(#textGradient)" stroke="#d8edff" stroke-opacity="0.33"
            stroke-width="0.8" paint-order="stroke fill">HANH NGUYEN</text>

      <!-- Dải ánh kim nghiêng lướt qua chữ, được cắt theo hình chữ -->
      <g clip-path="url(#letterMask)">
        <path d="M-280 25 H-145 L-235 142 H-370Z" fill="url(#shineGradient)" opacity="0.95">
          <animateTransform attributeName="transform" type="translate"
                            from="0 0" to="1080 0" dur="4s"
                            calcMode="spline" keyTimes="0;1"
                            keySplines="0.42 0 0.58 1" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Sao nhấp nháy lệch nhịp, đi theo cụm chữ -->
      <g transform="translate(70 53)">
        <g filter="url(#starGlow)">
          <use xlink:href="#sparkle"/>
        <animateTransform attributeName="transform" type="scale"
                          values="0.25;1;0.35;0.25" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0.4;0" dur="2.2s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(266 124)">
        <g filter="url(#starGlow)">
          <use xlink:href="#sparkle"/>
        <animateTransform attributeName="transform" type="scale"
                          values="0.2;0.8;0.2" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.95;0" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(455 43)">
        <g filter="url(#starGlow)">
          <use xlink:href="#sparkle"/>
        <animateTransform attributeName="transform" type="scale"
                          values="0.25;1.15;0.25" dur="3.1s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="1.1s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(625 130)">
        <g filter="url(#starGlow)">
          <use xlink:href="#sparkle"/>
        <animateTransform attributeName="transform" type="scale"
                          values="0.2;0.7;0.2" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Hạt sáng nhỏ lấp lánh bổ trợ -->
      <g fill="#fff">
        <circle cx="150" cy="45" r="1.8">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="370" cy="133" r="1.6">
          <animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="580" cy="50" r="1.5">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
