
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="220"
     viewBox="0 0 1400 220">

  <defs>
    <!-- Animated neon gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color"
          values="#38bdf8;#818cf8;#22d3ee;#38bdf8"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color"
          values="#c084fc;#f0abfc;#a78bfa;#c084fc"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color"
          values="#22d3ee;#60a5fa;#f472b6;#22d3ee"
          dur="8s" repeatCount="indefinite"/>
      </stop>

      <animate attributeName="x1"
        values="-100%;100%;-100%"
        dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2"
        values="0%;200%;0%"
        dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softGlow"
            x="-20%" y="-50%"
            width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Moving highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Main text -->
    <text id="messageText"
          x="0" y="132"
          font-family="Segoe UI, Arial, Helvetica, sans-serif"
          font-size="46"
          font-weight="800"
          letter-spacing="0.5"
          textLength="1300"
          lengthAdjust="spacingAndGlyphs">👋 Hey there! Welcome to my little corner of GitHub!</text>

    <!-- Text clipping for shine -->
    <clipPath id="textClip" clipPathUnits="userSpaceOnUse">
      <use xlink:href="#messageText"/>
    </clipPath>

    <!-- Viewport -->
    <clipPath id="stage">
      <rect x="0" y="0" width="1400" height="220"/>
    </clipPath>

    <!-- Sparkle -->
    <path id="star"
          d="M0,-10 L2.4,-2.4 L10,0 L2.4,2.4
             L0,10 L-2.4,2.4 L-10,0 L-2.4,-2.4 Z"
          fill="#ffffff"/>

    <!-- One complete text unit -->
    <g id="message">

      <!-- Glow layer -->
      <use xlink:href="#messageText"
           fill="url(#neon)"
           opacity="0.55"
           filter="url(#softGlow)"/>

      <!-- Main text -->
      <use xlink:href="#messageText"
           fill="url(#neon)"/>

      <!-- Subtle luminous outline -->
      <use xlink:href="#messageText"
           fill="none"
           stroke="#ffffff"
           stroke-width="0.7"
           stroke-opacity="0.22"/>

      <!-- Shine sweep -->
      <g clip-path="url(#textClip)">
        <rect x="1300" y="40"
              width="300" height="120"
              fill="url(#shine)"
              transform="skewX(-16)">
          <animate attributeName="x"
                   values="1300;-450"
                   dur="4.8s"
                   calcMode="linear"
                   repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Sparkle 1 -->
      <g transform="translate(130 58)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.35;1.1;0.35"
            dur="2.2s"
            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.15;1;0.15"
                   dur="2.2s"
                   repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

      <!-- Sparkle 2 -->
      <g transform="translate(590 166)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.25;0.95;0.25"
            dur="2.8s"
            begin="0.6s"
            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.1;0.9;0.1"
                   dur="2.8s"
                   begin="0.6s"
                   repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

      <!-- Sparkle 3 -->
      <g transform="translate(1080 62)">
        <g>
          <animateTransform
            attributeName="transform"
            type="scale"
            values="0.25;1;0.25"
            dur="2.5s"
            begin="1.1s"
            repeatCount="indefinite"/>
          <animate attributeName="opacity"
                   values="0.12;1;0.12"
                   dur="2.5s"
                   begin="1.1s"
                   repeatCount="indefinite"/>
          <use xlink:href="#star"/>
        </g>
      </g>

    </g>
  </defs>

  <!-- RIGHT TO LEFT - seamless loop -->
  <g clip-path="url(#stage)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-1450 0"
        dur="16s"
        calcMode="linear"
        repeatCount="indefinite"/>

      <use xlink:href="#message" x="0"/>
      <use xlink:href="#message" x="1450"/>
    </g>
  </g>

</svg>
